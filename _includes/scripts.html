<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/newsletter-panel.js' | relative_url }}" defer></script>
{% if site.google.ga4_measurement_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google.ga4_measurement_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', '{{ site.google.ga4_measurement_id }}');
</script>
{% endif %}
{% if page.layout == 'post' and site.mathjax %}
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
