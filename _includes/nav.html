<header class="site-header">
    <div class="container">
        <a class="site-brand" href="{{ site.url }}/">{{ site.title }}</a>
        <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open main menu">
            <span class="nav-toggle-icon" aria-hidden="true">
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
            </span>
        </button>
        <nav id="site-nav" class="site-nav" aria-label="Main">
            <a href="{{ site.url }}/">Home</a>
            <a href="{{ site.url }}/posts/">Posts</a>
            {% for link in site.data.navigation %}
            <a href="{{ site.url }}{{ link.url }}">{{ link.title }}</a>
            {% endfor %}
            <a href="{{ site.url }}/tags/">Tags</a>
            {% include books-link.html class="btn btn-primary btn-books" %}
        </nav>
    </div>
</header>
