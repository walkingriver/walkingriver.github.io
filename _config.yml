# Site
title:              WalkingRiver.com
bio:                'Author · Software Developer · Educator'
description:        'The best software is both elegant and beautiful, and seldom what you expect.'
gumroad:            'Sign up below to receive notification of new blog posts, plus free and discounted offers for my current and upcoming web development books and courses. I promise not to overwhelm you or sell your email address.'
reading_time:       true
words_per_minute:   200
logo:               'assets/img/mike-mmrr.jpg'
background:         'assets/img/mike-speaking-session.jpg'
locale:             en_US
url:                https://walkingriver.com

books_url:          https://walkingriver.github.io/books
books_link_text:    Browse my books

github:
  repository_url:   https://github.com/walkingriver/walkingriver.github.io

# Jekyll
excerpt_separator:  <!--more-->
permalink:          /:title/
markdown:           kramdown
highlighter:        rouge
kramdown:
  auto_ids:         true
  footnote_nr:      1
  entity_output:    as_char
  toc_levels:       1..6
  enable_coderay:   false
mathjax:            true
sass:
  sass_dir:         _sass
  style:            compressed

# Comments
# disqus_shortname:   walkingriver

# Analytics — set ga4_measurement_id when ready (Universal Analytics is deprecated)
google:
  # ga4_measurement_id: G-XXXXXXXXXX

# Social
twitter:            walkingriver
facebook:           walkingriverservices
github-url:         walkingriver
gumroad_url:        'https://gumroad.com/walkingriver'
linkedin:           michaelcallaghan2
youtube:            mdcsoft
amazon:             mcallaghan

plugins:
  - jekyll-mentions
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist

jekyll-mentions:
  base_url: https://github.com

exclude: [README.md, Gemfile, node_modules, gulpfile.js, package.json, _site, src, vendor, CNAME, LICENSE, Rakefile, _config-old.yml]

